# Checks NASA POWER on the 5th of every month and, when a new year of data is complete,
# downloads it, rebuilds public/data and commits the result to the branch this runs on.
#
# This does NOT deploy the site. deploy.yml only deploys main, so the new data goes live
# when this branch is merged to main.
#
# The download is slow (about 16,000 requests), so the cache is kept between runs and the
# job stops itself after 300 minutes. A later run carries on from where it stopped.

name: Monthly NASA data update

on:
  schedule:
    - cron: '17 3 5 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Keep partial downloads between runs (only needed while a year is being fetched).
      - uses: actions/cache@v4
        with:
          path: .cache/power-update
          key: power-update-${{ github.run_id }}
          restore-keys: power-update-

      - id: update
        run: node scripts/update-data.mjs --max-minutes 300

      - name: Commit new data
        if: steps.update.outputs.result == 'updated' || steps.update.outputs.result == 'partial' || steps.update.outputs.result == 'no-new-data'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          case "${{ steps.update.outputs.result }}" in
            updated) msg="Add NASA data to ${{ steps.update.outputs.end_year }}" ;;
            partial) msg="Partial NASA data download (checkpoint)" ;;
            *) msg="Check NASA data: nothing new yet" ;;
          esac
          git commit -m "$msg"
          git push
